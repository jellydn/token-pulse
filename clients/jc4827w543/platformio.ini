; Guition JC4827W543C (ESP32-S3-WROOM-1-N4R8).
; 480x272 NV3041A over QSPI, GT911 on I2C, 4 MB flash, 8 MB octal PSRAM.
; This is not the Sunton ESP32-4827S043 RGB panel. Do not define ESP32_4827S043.

[env:jc4827w543c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; DevKitC-1 defaults to an 8 MB partition table. This module is 4 MB flash.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Quad flash + octal PSRAM (N4R8). This Arduino package does not switch the
; qio_opi SDK from memory_type alone, and this slice does not allocate PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
; Do not commit real credentials. Override locally, for example:
;   -DWIFI_SSID=\"network\"
;   -DWIFI_PASSWORD=\"secret\"
;   -DDISPLAY_URL=\"https://tokens.example.ts.net/api/display\"
;   -DDISPLAY_ROOT_CA='"-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n"'
;   -DSKIP_TLS_VERIFY=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    bblanchon/ArduinoJson@6.21.5
